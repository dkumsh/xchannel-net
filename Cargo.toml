[workspace]
resolver = "3"
members = [
    "xchannel-net-core",
    "xchannel-net",
    "xchannel-net-client",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.89" # File::try_lock / TryLockError (data_dir .lock guard)
license = "MIT"
repository = "https://github.com/dkumsh/xchannel-net"
authors = ["Dmitriy Kumshayev <dq@mail.com>"]

[workspace.dependencies]
# The log/IPC substrate this project replicates over the network. 4.1.0 adds
# `Reader::head_record_index()` (true `SubscribeAck.head`); 4.2.0 adds `Reader::region_size()`
# + `mtu()`, used to recover geometry when re-registering origins on restart (§5.2); 4.3.0 adds
# `Reader::file_sequence()`, which makes the origin's roll boundaries observable so replicas can
# mirror its segmentation (and therefore its `keep_files` retention); 4.4.0 adds
# `ChannelHeader.generation`, the incarnation id that lets a replica tell "this log continues"
# from "this name was reclaimed by a new owner" (registry epoch goes here). 5.0.0 is
# `format_version = 3` — `channel_name` widened 20 → 48 bytes; greenfield, v2 files are refused.
# 5.1.0 makes a reader refuse a roll into a segment that breaks the absolute numbering, so a
# replica rebuilt under a live client `Reader` fails loudly instead of splicing two histories.
xchannel = { version = "5.1.0" }

# Internal crates referencing each other. `version` is required for crates.io publishing
# (the registry rejects a bare path dep); the `path` still wins for local/workspace builds.
xchannel-net-core = { path = "xchannel-net-core", version = "0.2.1" }
